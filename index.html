<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>La Graciosa · Slop Island</title>
  <meta name="description" content="Explora La Graciosa, Canarias, en una escena 3D de Three.js y WebGPU con relieve topográfico, edificios, pistas, costa y océano." />
  <meta name="theme-color" content="#14535a" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="La Graciosa · Slop Island" />
  <meta property="og:description" content="Explora La Graciosa en una aventura 3D interactiva con WebGPU." />
  <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="preconnect" href="https://server.arcgisonline.com" crossorigin />
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.webgpu.js",
        "three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.webgpu.js",
        "three/tsl": "https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.tsl.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.187.0/examples/jsm/"
      }
    }
  </script>
  <link rel="modulepreload" href="./js/main.js" />
  <link rel="modulepreload" href="./js/graciosa-main.js" />
  <link rel="modulepreload" href="./js/graciosa-coast.js" />
  <link rel="modulepreload" href="./js/island-minimap.js" />
  <link rel="modulepreload" href="./js/island-terrain-details.js" />
  <link rel="modulepreload" href="./js/graciosa-exploration.js" />
  <link rel="modulepreload" href="./js/graciosa-satellite.js" />
  <link rel="modulepreload" href="./js/island-camera-input.js" />
  <link rel="modulepreload" href="./js/island-camera-controller.js" />
  <link rel="modulepreload" href="./js/graciosa-geodata.js" />
  <link rel="modulepreload" href="./js/graciosa-terrain.js" />
  <link rel="modulepreload" href="./js/graciosa-elevation.js" />
  <script type="module" src="./js/main.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" />
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body>
  <section id="loading-screen" role="status" aria-live="polite" aria-label="Carga del juego">
    <div class="loading-card">
      <img class="loading-mark" src="./favicon.svg" alt="" />
      <p class="loading-eyebrow">LA GRACIOSA · ISLAS CANARIAS</p>
      <h1 id="loading-title">Preparando tu isla</h1>
      <div id="loading-progress" role="progressbar" aria-label="Carga del juego" aria-valuemin="0" aria-valuemax="100" aria-valuenow="4">
        <span id="loading-progress-fill"></span>
      </div>
      <p id="loading-message">Iniciando el motor gráfico…</p>
      <p id="loading-error" hidden></p>
      <button id="loading-retry" type="button" hidden>Volver a intentar</button>
    </div>
  </section>
  <main id="canvas-container" aria-label="Escena 3D de La Graciosa"></main>
  <aside id="minimap-panel" aria-label="Minimapa de La Graciosa">
    <div class="minimap-heading"><span>LA GRACIOSA</span><span class="minimap-subtitle">Pulsa tierra para ir</span></div>
    <canvas id="island-minimap" role="img" tabindex="0" aria-label="Minimapa ampliado de La Graciosa. Pulsa sobre tierra para teletransportar al jugador."></canvas>
    <div class="minimap-controls" aria-label="Controles del minimapa">
      <button type="button" data-map-zoom="in" aria-label="Acercar minimapa">+</button>
      <button type="button" data-map-zoom="out" aria-label="Alejar minimapa">−</button>
      <button type="button" data-map-center aria-label="Centrar minimapa en el jugador">Centrar</button>
    </div>
    <a id="osm-attribution" href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener noreferrer">© OpenStreetMap contributors</a>
    <a id="imagery-attribution" hidden href="https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer" target="_blank" rel="noopener noreferrer">Imagen del terreno © Esri, Maxar, Earthstar Geographics y GIS User Community</a>
  </aside>
  <nav id="exploration-hud" aria-label="Controles de exploración">
    <div id="compass" aria-label="Brújula, norte"><span>N</span><i></i><b id="waypoint-arrow" hidden></b><strong>N</strong></div>
    <div id="exploration-modes" role="group" aria-label="Modo de exploración">
      <button type="button" data-exploration-mode="person" aria-pressed="true">A pie</button>
      <button type="button" data-exploration-mode="seagull" aria-pressed="false">Gaviota</button>
    </div>
    <button id="camera-mode" type="button" aria-pressed="true">Vista: tercera persona</button>
  </nav>
  <div id="aim-reticle" aria-hidden="true" hidden><span></span><span></span></div>
  <span id="fps-counter" role="img" aria-label="Fotogramas por segundo: sin medir">FPS: --</span>
  <div id="touch-controls" aria-label="Controles táctiles de movimiento">
    <button type="button" data-move="KeyW" aria-label="Avanzar">▲</button>
    <div>
      <button type="button" data-move="KeyA" aria-label="Mover a la izquierda">◀</button>
      <button type="button" data-move="KeyS" aria-label="Retroceder">▼</button>
      <button type="button" data-move="KeyD" aria-label="Mover a la derecha">▶</button>
    </div>
    <div>
      <button type="button" data-fly="up" aria-label="Subir como gaviota">Subir</button>
      <button type="button" data-fly="down" aria-label="Bajar como gaviota">Bajar</button>
      <button type="button" data-jump aria-label="Saltar o frenar">Salto</button>
      <button type="button" data-run aria-label="Correr o acelerar">Correr</button>
    </div>
  </div>
  <div id="status" role="status">Cargando La Graciosa…</div>
</body>
</html>
